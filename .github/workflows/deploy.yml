name: Build and Test

on:
  push:
    branches: [main, test]
  pull_request:

env:
  PROJECT_ID: cloudops360
  REGION: us-central1
  SERVICE: connector-aws
  REPO: cloudops360

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Verify private dependency credential
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::GH_PAT is not configured for the private @horizonvigil/shared-lib dependency"
            exit 1
          fi
      - name: Configure git for private shared-lib dependency
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          printf "machine github.com\nlogin x-access-token\npassword %s\n" "${{ secrets.GH_PAT }}" > ~/.netrc
          chmod 600 ~/.netrc
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Genuinely separate test environment: its own GCP project
  # (cloudops360-test, own CPU quota) and its own Supabase project
  # (staging) for auth and all data, not just billing.
  deploy-test:
    needs: build-and-test
    if: github.ref == 'refs/heads/test' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT_ID: cloudops360-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_TEST }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DOCKER_BUILDKIT: "1"
        run: |
          # AWS-C2. Production deploys from cloudbuild.yaml only; this job
          # targets the separate test project. The guard is applied here anyway
          # so that NO deploy path in this repo can reach a mutable tag, and so
          # the rule does not depend on which job someone edits next.
          TAG="${{ github.sha }}"
          case "$TAG" in
            latest|Latest|LATEST)
              echo "REFUSING: '$TAG' is a mutable tag and must never be deployed." >&2
              exit 1 ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "REFUSING: deploy tag '$TAG' is not a 40-hex commit SHA." >&2
            exit 1
          fi

          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:$TAG"
          docker build --secret id=gh_pat,env=GH_PAT -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=256Mi \
            --set-env-vars="SUPABASE_URL=https://jhwaujnlgjlvixnvleqc.supabase.co,SUPABASE_ANON_KEY=sb_publishable_baBKAWA0j4QkFYzbpJBM5Q_J4q-EXlP,ALLOWED_ORIGIN=https://frontend-975304691244.us-central1.run.app,DB_SCHEMA=public,AUTOMATION_API_URL=https://automation-975304691244.us-central1.run.app,ENCRYPTION_KEY=${ENCRYPTION_KEY}"

      - name: Show service URL
        run: gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format='value(status.url)'
