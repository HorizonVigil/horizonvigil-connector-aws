# Phase 1J — integration and isolation tests, separate from unit tests.
#
# Separate workflow, not another step in deploy.yml, for two reasons: these
# need credentials the unit suite does not, and a red isolation run should
# be legible as "isolation broke" rather than buried in a deploy log.
#
# The suite FAILS when the database is unreachable. It never skips: a
# skipped tenant-isolation test reports green while proving nothing, which
# is the exact failure this phase exists to remove.
name: Integration & Isolation Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The shared-lib git dependency is a PRIVATE repo, so npm's git fetch
      # must be authenticated. npm does not read a GH_PAT env var -- it needs
      # credentials in ~/.netrc. Setting the env var alone (as this workflow
      # originally did) fails at install with "Permission denied (publickey)"
      # before any test runs, which reads as "integration tests are broken"
      # rather than "CI cannot fetch a dependency".
      #
      # Byte-for-byte the pattern deploy.yml already uses successfully.
      - name: Authenticate npm for the private shared-lib dependency
        run: |
          printf "machine github.com\nlogin x-access-token\npassword %s\n" "${{ secrets.GH_PAT }}" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Install
        run: npm install

      # Guard rail: without this a missing secret would surface as an
      # obscure sign-in error deep in the run rather than a clear failure.
      - name: Verify integration credentials are present
        run: |
          if [ -z "${INTEGRATION_SUPABASE_URL}" ] || [ -z "${INTEGRATION_SUPABASE_ANON_KEY}" ]; then
            echo "::error::INTEGRATION_SUPABASE_URL / INTEGRATION_SUPABASE_ANON_KEY are not set."
            echo "::error::The integration suite must FAIL rather than skip when it cannot reach a database."
            exit 1
          fi
        env:
          INTEGRATION_SUPABASE_URL: ${{ secrets.INTEGRATION_SUPABASE_URL }}
          INTEGRATION_SUPABASE_ANON_KEY: ${{ secrets.INTEGRATION_SUPABASE_ANON_KEY }}

      - name: Unit tests
        run: npm test

      - name: Integration & isolation tests
        run: npm run test:integration
        env:
          INTEGRATION_SUPABASE_URL: ${{ secrets.INTEGRATION_SUPABASE_URL }}
          INTEGRATION_SUPABASE_ANON_KEY: ${{ secrets.INTEGRATION_SUPABASE_ANON_KEY }}
