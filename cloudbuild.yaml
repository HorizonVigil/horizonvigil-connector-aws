# Real CI/CD: a Cloud Build trigger (connected directly to this repo's
# GitHub App connection, not GitHub Actions) runs this on every push to
# main -- build, push, deploy, no self-hosted runner or GitHub Actions
# minutes involved at all. Sidesteps GitHub Actions' account-wide billing
# block entirely, and the shared-lib git dependency's authenticated-clone
# requirement (see Dockerfile) the same way the old manual fallback did:
# `docker buildx build --secret` mounts GH_PAT as a file, never a
# --build-arg (which would otherwise land in image layer history).
#
# Still runnable by hand: gcloud builds submit --config=cloudbuild.yaml --region=us-central1 .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker buildx create --use --name ci-builder --driver docker-container >/dev/null 2>&1 || docker buildx use ci-builder
        printf '%s' "$$GH_PAT" > /tmp/gh_pat
        docker buildx build --secret id=gh_pat,src=/tmp/gh_pat --load -t us-central1-docker.pkg.dev/cloudops360/cloud-run-source-deploy/connector-aws:latest .
        rm -f /tmp/gh_pat
    secretEnv: ['GH_PAT']
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args: ['push', 'us-central1-docker.pkg.dev/cloudops360/cloud-run-source-deploy/connector-aws:latest']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: gcloud
    # min/max-instances=1 pinned on every deploy, not just the first --
    # otherwise a later `gcloud run deploy` without these flags resets
    # max-instances to its service default and the account-wide
    # instance-limit guardrail silently stops applying.
    args:
      - 'run'
      - 'deploy'
      - 'connector-aws'
      - '--image=us-central1-docker.pkg.dev/cloudops360/cloud-run-source-deploy/connector-aws:latest'
      - '--region=us-central1'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--quiet'
availableSecrets:
  secretManager:
    - versionName: projects/cloudops360/secrets/gh_pat/versions/latest
      env: 'GH_PAT'
