# Manual-deploy fallback for when `gcloud run deploy --source .` can't be
# used (GitHub Actions CI is account-wide blocked on a billing failure this
# session). Needed specifically because the shared-lib git dependency
# requires an authenticated clone (see Dockerfile) and the plain
# `gcloud run deploy --source` path has no way to inject a build secret at all.
# `docker buildx create --use` below provisions a real BuildKit backend so
# `docker buildx build --secret` can mount GH_PAT as a file instead of a
# --build-arg (which would otherwise land in image layer history).
#
# Usage: gcloud builds submit --config=cloudbuild.yaml --region=us-central1 .
#        gcloud run deploy connector-aws --image=us-central1-docker.pkg.dev/cloudops360/cloud-run-source-deploy/connector-aws:latest --region=us-central1
steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker buildx create --use --name ci-builder --driver docker-container >/dev/null 2>&1 || docker buildx use ci-builder
        printf '%s' "$$GH_PAT" > /tmp/gh_pat
        docker buildx build --secret id=gh_pat,src=/tmp/gh_pat --load -t us-central1-docker.pkg.dev/cloudops360/cloud-run-source-deploy/connector-aws:latest .
        rm -f /tmp/gh_pat
    secretEnv: ['GH_PAT']
availableSecrets:
  secretManager:
    - versionName: projects/cloudops360/secrets/gh_pat/versions/latest
      env: 'GH_PAT'
images:
  - 'us-central1-docker.pkg.dev/cloudops360/cloud-run-source-deploy/connector-aws:latest'
